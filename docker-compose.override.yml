services:
  db:
    restart: "no"
    ports:
      - "5433:5432" # Puerto 5433 en host para no colisionar con 5432 de honeymetrics v1

  api:
    restart: "no"
    ports:
      - "8001:8000" # Puerto 8001 en host para convivir limpiamente con el puerto 8000 de v1
    volumes:
      - .:/app
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  # Túnel Cloudflare para Desarrollo (Live Reload + Debug True expuesto a dominio público)
  # Se activa exclusivamente con: docker compose --profile tunnel up
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: hm_v2_api_cloudflared_dev
    restart: "no"
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles:
      - tunnel
    networks:
      - hm_v2_network
    depends_on:
      - api
