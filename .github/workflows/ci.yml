name: Backend CI/CD Pipeline & Quality Gate

on:
  push:
    branches: [ main, develop, QA ]
  pull_request:
    branches: [ main, develop, QA ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-style:
    name: 🎨 Linting & Code Style (Ruff, Black, Mypy)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Linting & Typing Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy

      - name: ⚡ Run Ruff Linter
        run: |
          ruff check .

      - name: 🖤 Check Code Formatting with Black
        run: |
          black --check .

      - name: 🔍 Static Type Checking with Mypy
        run: |
          mypy --explicit-package-bases app/

  test-and-coverage:
    name: 🧪 Testing & Coverage (Pytest & pytest-cov)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Pytest Suite with Coverage
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml tests/

      - name: 📊 Upload Coverage Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage.xml
          retention-days: 7

  security-sast:
    name: 🛡️ SAST Security Scan (Bandit)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Bandit
        run: pip install bandit

      - name: 🔍 Scan for Common Security Flaws
        run: |
          bandit -r app/ -ll -ii
