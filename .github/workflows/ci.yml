name: Backend CI/CD Pipeline & Quality Gate

on:
  push:
    branches: [ main, develop, QA ]
  pull_request:
    branches: [ main, develop, QA ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-style:
    name: 🎨 Linting & Code Style (Ruff, Black, Mypy)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Linting & Typing Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy

      - name: ⚡ Run Ruff Linter
        run: |
          ruff check app/ tests/

      - name: 🖤 Check Code Formatting with Black
        run: |
          black --check app/ tests/

      - name: 🔍 Static Type Checking with Mypy (Advisory)
        run: |
          mypy --explicit-package-bases app/
        continue-on-error: true


  test-and-coverage:
    name: 🧪 Testing & Coverage (Pytest & pytest-cov)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Pytest Suite with Coverage
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml tests/

      - name: 📊 Upload Coverage Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: coverage.xml
          retention-days: 7

  security-sast:
    name: 🛡️ SAST Security Scan & Dependency Audit (Bandit & pip-audit)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Security Audit Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: 🔍 Bandit SAST Security Scan
        run: |
          bandit -r app/ -ll -ii

      - name: 🛡️ Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit -r requirements.txt

  docker-build-check:
    name: 🐳 Production Docker Build Smoke Test
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: "docker-compose.yml:docker-compose.prod.yml"

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📄 Prepare Environment Configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: 🐳 Verify Production Docker Compose Build
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml build
