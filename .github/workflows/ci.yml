name: Backend CI & Quality Gate

on:
  push:
    branches: [ main, QA, develop ]
  pull_request:
    branches: [ main, QA, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-lint:
    name: 🧪 Pytest (Cov >= 70%), Ruff & Alembic Graph
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov httpx

      - name: ⚡ Run Ruff Linter (Syntax & Undefined Names)
        run: |
          ruff check app/ --select E9,F63,F7,F82

      - name: 🗃️ Validate Single Alembic Migration Head
        run: |
          heads_count=$(alembic heads | grep -c '(head)' || true)
          echo "Alembic heads detected: $heads_count"
          test "$heads_count" -eq 1

      - name: 🧪 Execute Pytest Suite with Coverage Gate (70%)
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70

      - name: 📎 Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security-sast:
    name: 🛡️ SAST Security Scan (Bandit) & Docker Smoke
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Bandit
        run: pip install bandit

      - name: 🔍 Scan for Medium/High Severity Security Flaws
        run: |
          bandit -r app/ -ll -ii

      - name: 🐳 Multi-Stage Dockerfile Smoke Build
        run: |
          docker build -t hm_v2_api:smoke -f Dockerfile .
