name: Backend CI & Quality Gate

on:
  push:
    branches: [ main, develop, QA ]
  pull_request:
    branches: [ main, develop, QA ]

jobs:
  test-and-lint:
    name: 🧪 Run Pytest & Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: 🧪 Execute Pytest Suite
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: 🗃️ Validate Alembic migration graph
        run: |
          test "$(alembic heads | grep -c '(head)')" -eq 1

      - name: 📎 Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security-sast:
    name: 🛡️ SAST Security Scan (Bandit)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install Bandit
        run: pip install bandit

      - name: 🔍 Scan for Common Security Flaws
        run: |
          bandit -r app/ -ll -ii
